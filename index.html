<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reincarnate into monsters and explore ever-changing Isekai worlds in this offline single-player fantasy RPG.">
    <title>Isekaimania - Overworld RPG Wiki</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="monster-wiki.css">
</head>
<body>
    <div id="app">
        <div class="hamburger" onclick="toggleMenu()" aria-label="Toggle navigation">☰</div>

        <nav id="main-nav">
            <img src="isekaimania_official_icon.png" alt="Isekaimania - Overworld RPG" class="nav-logo">

            <select id="langSelect" aria-label="Language">
                <option value="en" selected>🇬🇧 English</option>
            </select>

            <div class="game-info">
                <strong>Isekaimania - Overworld RPG</strong><br>
                AUBJECTIVE TECHNOLOGY LTD.<br>
                Contains ads • In-app purchases
            </div>

            <hr>
            <div class="menu-item" data-view="Home" onclick="loadView('Home')">🏠 <span data-ui="home">Home</span></div>
            <div class="menu-item" data-view="Characters" onclick="loadView('Characters')">🧑 <span data-ui="characters">Characters</span></div>
            <div class="menu-item" data-view="Jobs" onclick="loadView('Jobs')">⚔️ <span data-ui="jobs">Jobs</span></div>
            <div class="menu-item" data-view="Monsters" onclick="loadView('Monsters')">👾 <span data-ui="monsters">Monsters</span></div>
            <hr>
            <a href="https://play.google.com/store/apps/details?id=com.aubjective.isekaimania&hl=en" target="_blank" rel="noopener noreferrer" class="menu-link">▶️ Google Play</a>
            <a href="https://discord.gg/AKvAd3xpb" target="_blank" rel="noopener noreferrer" class="menu-link">💬 Join Discord</a>
        </nav>

        <main id="content"><h1>Loading Wiki Data...</h1></main>
    </div>

    <script>window.ISEKAIMANIA_LOCALE = 'en';</script>
    <script src="app.js"></script>
    <script src="monster-wiki.js"></script>
</body>
</html>
