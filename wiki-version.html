<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Isekaimania Wiki — Version Log</title>
<link rel="stylesheet" href="style.css">
<style>
body{margin:0;padding:24px;background:#0f131b;color:#e8edf5;font:16px/1.6 system-ui,sans-serif}
main{max-width:850px;margin:auto}
a{color:#9fceff}h1{line-height:1.2}
.panel{border:1px solid #344054;border-radius:12px;padding:20px;margin:20px 0;background:#182130}
small,.muted{color:#afbbca}.entry{border-top:1px solid #39445a;padding:16px 0}
.pill{display:inline-block;border:1px solid #71819e;border-radius:24px;padding:2px 10px;font-size:13px}
</style></head><body><main>
<p><a href="index.html">← Back to Isekaimania Wiki</a></p>
<h1>Isekaimania Wiki — Version Log</h1>
<div class="panel" id="version-status"><p>Loading version history…</p></div>
<section class="panel"><h2>History</h2><div id="history"></div></section>
<p class="muted">The wiki's version is separate from the game's release version. Only verified Sheet synchronization is recorded as complete.</p>
<script>
(async()=>{
 const el=document.querySelector('#version-status'),history=document.querySelector('#history');
 try{
 const r=await fetch('data/version_log.json',{cache:'no-store'});if(!r.ok)throw new Error('Version history unavailable');
 const d=await r.json(), p=d.publicStatus||{}, check=d.checkpoints||{};
 el.replaceChildren();
 const h=document.createElement('h2');h.textContent='Wiki '+(d.wikiVersion||'—');el.append(h);
 const t=document.createElement('p');t.textContent=p.summary||'Wiki synchronization status unavailable';el.append(t);
 const c=document.createElement('p');c.className='muted';c.textContent='Updated: '+(p.asOf||'—')+' · Latest game version observed: '+(check.latestSourceGameVersionObserved||'—')+' · Last fully audited game version: '+(check.lastAuditedGameVersion||'Not yet verified');el.append(c);
 if(Array.isArray(p.ongoing)&&p.ongoing.length){let sub=document.createElement('h3');sub.textContent='Ongoing';el.append(sub);let ul=document.createElement('ul');for(const x of p.ongoing){let li=document.createElement('li');li.textContent=x;ul.append(li)}el.append(ul)}
 const entries=[...(d.entries||[])].reverse();if(!entries.length)history.textContent='No entries yet.';
 for(const x of entries){let div=document.createElement('div');div.className='entry';let strong=document.createElement('strong');strong.textContent='Wiki '+x.wikiVersion+' · '+x.date;div.append(strong);let status=document.createElement('span');status.className='pill';status.style.marginLeft='10px';status.textContent=x.status||'—';div.append(status);let p=document.createElement('p');p.textContent=x.summary||'';div.append(p);if(x.notes){let note=document.createElement('small');note.textContent=x.notes;div.append(note)}history.append(div)}
 }catch(e){el.textContent='Version log could not be loaded. Please try again later.';history.textContent='No history available.'}
})();
</script></main></body></html>
